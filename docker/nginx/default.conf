# =============================================================================
# BOARD POINT — Nginx como proxy reverso
#   /admin/api/*  -> backend  (PHP)
#   demais rotas  -> frontend (estáticos)
# Os nomes "backend" e "frontend" são resolvidos pelo DNS interno do Docker.
# =============================================================================

upstream backend_php {
    server backend:80;
}

upstream frontend_estatico {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Fotos de produto: o padrão do Nginx (1 MB) barraria o upload (erro 413).
    client_max_body_size 10m;

    # Equivalente ao .htaccess: esconde arquivos sensíveis.
    location ~* \.(sql|md|env|yml|yaml)$ { return 404; }
    location ~ /\.(git|ht|env) { return 404; }
    location ~ ^/admin/api/(config|config_loja|config_local|GeradorPix)(\.example)?\.php(/|$){ return 404; }

    # API PHP
    location /admin/api/ {
        proxy_pass http://backend_php;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Site e painel (estáticos)
    location / {
        proxy_pass http://frontend_estatico;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
