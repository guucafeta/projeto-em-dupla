<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Board Point Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <style>
    /* Estilos para alternar entre as abas de Login e Cadastro */
    .abas-auth { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; }
    .aba-btn { background: none; border: none; color: #aaa; padding: 8px 16px; cursor: pointer; font-weight: bold; }
    .aba-btn.ativa { color: #fff; border-bottom: 2px solid #0d6efd; }
    .painel-auth { display: none; }
    .painel-auth.ativo { display: block; }
  </style>
</head>
<body>

<div class="tela-login">
  <div class="cartao-login">
    <div class="marca">BOARD POINT</div>
    <div class="subtitulo">Painel administrativo</div>

    <!-- Div para exibir as mensagens de erro ou sucesso -->
    <div class="mensagem-erro" id="mensagem-status"></div>

    <!-- Seletor de Abas: Login e Cadastro -->
    <div class="abas-auth">
      <button type="button" class="aba-btn ativa" id="btnAbaLogin">Login</button>
      <button type="button" class="aba-btn" id="btnAbaRegistro">Cadastro</button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <div class="painel-auth ativo" id="painelLogin">
      <form id="form-login">
        <div class="campo-grupo mb-3">
          <label for="login-email">E-mail</label>
          <input type="email" id="login-email" name="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="campo-grupo mb-3">
          <label for="login-senha">Senha</label>
          <input type="password" id="login-senha" name="senha" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="botao-primario btn w-100" id="botaoEntrar">Entrar</button>
      </form>
    </div>

    <!-- FORMULÁRIO DE CADASTRO -->
    <div class="painel-auth" id="painelRegistro">
      <form id="form-registro">
        <div class="campo-grupo mb-3">
          <label for="reg-nome">Nome Completo</label>
          <input type="text" id="reg-nome" class="form-control" required placeholder="Seu nome">
        </div>
        <div class="campo-grupo mb-3">
          <label for="reg-email">E-mail</label>
          <input type="email" id="reg-email" class="form-control" required placeholder="seu@email.com">
        </div>
        <div class="campo-grupo mb-3">
          <label for="reg-cpf">CPF</label>
          <input type="text" id="reg-cpf" class="form-control" required placeholder="000.000.000-00">
        </div>
        <div class="campo-grupo mb-3">
          <label for="reg-senha">Senha</label>
          <input type="password" id="reg-senha" class="form-control" required placeholder="Mínimo 8 chars, 1 maiúscula, símbolo">
        </div>
        <button type="submit" class="botao-primario btn w-100">Cadastrar</button>
      </form>
    </div>

    <a href="../index.html" class="link-voltar-site mt-3 d-inline-block">← Voltar ao site</a>
  </div>
</div>

<!-- Lógica simples para alternar entre as abas -->
<script>
  const btnAbaLogin = document.getElementById('btnAbaLogin');
  const btnAbaRegistro = document.getElementById('btnAbaRegistro');
  const painelLogin = document.getElementById('painelLogin');
  const painelRegistro = document.getElementById('painelRegistro');

  btnAbaLogin.addEventListener('click', () => {
    btnAbaLogin.classList.add('ativa');
    btnAbaRegistro.classList.remove('ativa');
    painelLogin.classList.add('ativo');
    painelRegistro.classList.remove('ativo');
  });

  btnAbaRegistro.addEventListener('click', () => {
    btnAbaRegistro.classList.add('ativa');
    btnAbaLogin.classList.remove('ativa');
    painelRegistro.classList.add('ativo');
    painelLogin.classList.remove('ativo');
  });
</script>

<!-- Importa o nosso módulo TypeScript/JavaScript compilado -->
<script type="module" src="../js/auth.js"></script>

</body>
</html>
