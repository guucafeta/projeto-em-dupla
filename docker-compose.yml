name: boardpoint

services:

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      - ./back/database/boardpoint_completo.sql:/docker-entrypoint-initdb.d/01-boardpoint.sql:ro
      - ./back/database/002_usuarios.sql:/docker-entrypoint-initdb.d/02-usuarios.sql:ro
      - ./back/database/003_login_admin_email.sql:/docker-entrypoint-initdb.d/03-login-admin-email.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - rede_db

  backend:
    build:
            context: ./back/docker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      PIX_CHAVE: ${PIX_CHAVE}
      PIX_NOME_RECEBEDOR: ${PIX_NOME_RECEBEDOR:-BOARD POINT}
      PIX_CIDADE: ${PIX_CIDADE:-CAMPO MOURAO}
    volumes:
      - ./back/api:/var/www/html/admin/api:ro
      - uploads:/var/www/html/produtos/uploads
    networks:
      - rede_backend
      - rede_db

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./front/docker/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front/index.html:/usr/share/nginx/html/index.html:ro
      - ./front/css:/usr/share/nginx/html/css:ro
      - ./front/js:/usr/share/nginx/html/js:ro
      - ./front/assets:/usr/share/nginx/html/assets:ro
      - ./front/cliente:/usr/share/nginx/html/cliente:ro
      - ./front/produtos:/usr/share/nginx/html/produtos:ro
      - uploads:/usr/share/nginx/html/produtos/uploads:ro
      - ./front/admin/login.html:/usr/share/nginx/html/admin/login.html:ro
      - ./front/admin/pages:/usr/share/nginx/html/admin/pages:ro
      - ./front/admin/assets:/usr/share/nginx/html/admin/assets:ro
    networks:
      - rede_frontend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - rede_frontend
      - rede_backend

networks:
  rede_frontend:
  rede_backend:
  rede_db:
    internal: true

volumes:
  db_data:
  uploads: